# Provoz na vlastním serveru: aplikace + PostgreSQL.
#   1) cp .env.example .env  a nastavte POSTGRES_PASSWORD
#   2) docker compose up -d --build
#   3) docker compose exec app node --experimental-strip-types --no-warnings scripts/create-admin.mjs vas@email.cz
# Aplikaci vystavte přes HTTPS (např. Caddy / Nginx reverse proxy).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ztrouby
      POSTGRES_USER: ztrouby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nastavte POSTGRES_PASSWORD v .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ztrouby -d ztrouby']
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ztrouby:${POSTGRES_PASSWORD}@db:5432/ztrouby
    ports:
      - '127.0.0.1:3000:3000'
volumes:
  db-data:
